    stats: function (b) {
      return '<div class="stats" data-n="' + arr(b.items).length + '">' + arr(b.items).map(function (it) {
        return '<div class="stat' + cls(it.state) + '"><div class="v">' + esc(it.value) + (it.unit ? '<small>' + esc(it.unit) + '</small>' : '') + '</div><div class="l">' + esc(it.label) + '</div>' + (it.sub ? '<div class="sub">' + md(it.sub) + '</div>' : '') + spark(it.trend, st(it.state) ? 'var(--c)' : 'var(--cora)') + '</div>';
      }).join('') + '</div>';
    },
    steps: function (b) {
      var items = arr(b.items), done = items.filter(function (i) { var s = st(i.state); return s === 'ok' || s === 'skip'; }).length;
      return (items.length ? '<div class="bar"><i style="width:' + (done / items.length * 100) + '%"></i></div>' : '') + '<ul class="steps">' + items.map(function (it) {
        var s = st(it.state) || 'todo';
        return '<li class="s-' + s + '"><span class="ic"></span><span class="t">' + md(it.label) + (it.note ? '<span class="n">' + md(it.note) + '</span>' : '') + '</span><span class="d">' + (s === 'run' ? ticking(it.started) : it.ended ? ticking(it.started, it.ended) : '') + '</span></li>';
      }).join('') + '</ul>';
    },
    table: function (b) {
      var cols = arr(b.columns).map(function (c) { return typeof c === 'string' ? { key: c, label: c } : c || {}; });
      var cell = function (row, c, i) { return Array.isArray(row) ? row[i] : row == null ? '' : row[c.key]; };
      var isNum = function (c, i) { return c.align === 'right' || arr(b.rows).length > 0 && arr(b.rows).every(function (r) { var v = cell(r, c, i); return v === '' || v == null || typeof v === 'number'; }); };
      var num = cols.map(isNum);
      return '<div class="tw"><table><thead><tr>' + cols.map(function (c, i) { return '<th' + (num[i] ? ' class="num"' : '') + '>' + esc(c.label == null ? c.key : c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' + arr(b.rows).map(function (r) {
        var state = Array.isArray(r) ? '' : r && r.state;
        return '<tr class="' + cls(state).trim() + '">' + cols.map(function (c, i) { return '<td' + (num[i] ? ' class="num"' : '') + '>' + (i === 0 && st(state) ? '<i class="dot"></i>' : '') + md(cell(r, c, i)) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
    },
    chart: function (b) {
      var has = arr(b.series).some(function (x) { return nums(x && x.values).length; });
      if (!has) return '<div class="unknown">No data yet.</div>';
      if (!window.echarts) return svgChart(b);
      charts.push(b);
      return '<div class="ech" style="height:' + Math.max(120, Math.min(480, Number(b.height) || 200)) + 'px"></div>';
    },
    timeline: function (b) {
      return '<ul class="tl">' + arr(b.items).map(function (it) { return '<li class="' + cls(it.state).trim() + '"><time>' + hhmm(it.at) + '</time><span>' + md(it.text) + '</span></li>'; }).join('') + '</ul>';
    },
    note: function (b) { return '<div class="note' + cls(b.state) + '">' + md(b.text).replace(/\n/g, '<br>') + '</div>'; },
    meters: function (b) {
      return '<div class="meters">' + arr(b.items).map(function (it) {
        var max = Number(it.max) || 100, v = Number(it.value) || 0;
        return '<div class="meter' + cls(it.state) + '"><div class="top"><b>' + esc(it.label) + '</b><span>' + esc(it.text != null ? it.text : v + ' / ' + max) + '</span></div><div class="bar"><i style="width:' + Math.max(0, Math.min(100, v / max * 100)) + '%"></i></div></div>';
      }).join('') + '</div>';
    },
    kv: function (b) { return '<dl class="kv">' + arr(b.items).map(function (p) { var k = Array.isArray(p) ? p[0] : p && p.label, v = Array.isArray(p) ? p[1] : p && p.value; return '<dt>' + esc(k) + '</dt><dd>' + md(v) + '</dd>'; }).join('') + '</dl>'; },
    log: function (b) { var lines = arr(b.lines); return '<pre class="log">' + esc((lines.length ? lines.join('\n') : b.text || '')) + '</pre>'; },
    actions: function (b) { return buttons(b.items); }
  };
  // ---- buttons: { label, prompt | url, confirm?, state?, main? }. A click is posted to Cora, which sends the prompt to
  // the session (or opens the link) and says how it went; nothing here can act by itself.
  var acts = {}, actN = 0;
  function buttons(list) {
    var ok = arr(list).filter(function (a) { return a && a.label != null && (typeof a.prompt === 'string' || typeof a.url === 'string'); });
    if (!ok.length) return '';
    return '<div class="acts">' + ok.map(function (a) {
      var id = 'a' + (++actN);
      acts[id] = a;
      var what = typeof a.prompt === 'string' ? 'Sends to the session: ' + a.prompt : 'Opens ' + a.url;
      return '<button class="act' + (a.main ? ' main' : '') + cls(a.state) + '" data-act="' + id + '" title="' + esc(what + (a.confirm ? ' (click twice)' : '')) + '">' + esc(a.label) + (typeof a.url === 'string' && typeof a.prompt !== 'string' ? '<span class="k">↗</span>' : '') + '</button>';
    }).join('') + '</div>';
  }
  document.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    var a = btn && acts[btn.getAttribute('data-act')];
    if (!a || btn.disabled) return;
    // a risky one asks in itself: the first click arms it (it says so, for a few seconds), the second sends
    if (a.confirm && !btn.classList.contains('armed')) {
      var was = btn.innerHTML;
      btn.classList.add('armed');
      btn.innerHTML = 'Click again to confirm';
      btn._disarm = setTimeout(function () { if (btn.isConnected) { btn.classList.remove('armed'); btn.innerHTML = was; } }, 4000);
      btn._was = was;
      return;
    }
    if (btn._disarm) { clearTimeout(btn._disarm); btn.classList.remove('armed'); btn.innerHTML = btn._was; }
    btn.disabled = true;
    btn.classList.remove('sent', 'fail');
    var id = btn.getAttribute('data-act');
    window.parent.postMessage({ cora: 'action', id: id, label: String(a.label), prompt: typeof a.prompt === 'string' ? a.prompt : undefined, url: typeof a.prompt === 'string' ? undefined : a.url, confirm: !!a.confirm }, '*');
    // no word back (an older Cora, or the page opened on its own): the button comes back
    setTimeout(function () { if (btn.isConnected && btn.disabled && !btn.classList.contains('sent')) btn.disabled = false; }, 15000);
  });
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || e.data.cora !== 'action-result') return;
    var btn = document.querySelector('[data-act="' + String(e.data.id).replace(/[^\w]/g, '') + '"]');
    if (!btn) return;
    btn.classList.add(e.data.ok ? 'sent' : 'fail');
    if (e.data.ok) { var was = btn.innerHTML; btn.innerHTML = esc(e.data.note || 'Sent') + ' ✓'; setTimeout(function () { if (btn.isConnected) { btn.innerHTML = was; btn.disabled = false; btn.classList.remove('sent'); } }, 2500); }
    else { btn.disabled = false; btn.title = e.data.note ? String(e.data.note) : btn.title; }
  });
  var BARE = { stats: 1, note: 1, actions: 1 };

  var shown = {};
  function render(data) {
    data = data && typeof data === 'object' ? data : {};
    $('empty').style.display = arr(data.blocks).length || data.title ? 'none' : '';
    $('title').textContent = data.title || '';
    document.title = data.title || 'Dashboard';
    var s = data.status;
    var word = s && typeof s === 'object' ? s.text : s, state = s && typeof s === 'object' ? s.state || s.text : s;
    $('status').innerHTML = word ? '<span class="pill' + cls(state) + '"><i></i>' + esc(word) + '</span>' : '';
    $('clock').innerHTML = ticking(data.started, data.ended);
    $('summary').innerHTML = md(data.summary || '');
    // the blocks, each kept by its id (else its type and title): a new one comes in, a changed one redraws, one no longer
    // listed goes: the page reshapes itself as the work does
    var grid = $('grid'), seen = {}, prev = null;
    arr(data.blocks).forEach(function (b, i) {
      if (!b || typeof b !== 'object') return;
      var key = String(b.id || (b.type + ':' + (b.title || i)));
      if (seen[key]) return;
      seen[key] = 1;
      var json = JSON.stringify(b), el = shown[key] && shown[key].el;
      if (!el) { el = document.createElement('section'); el.className = 'blk in'; shown[key] = { el: el, json: '' }; }
      if (shown[key].json !== json) {
        var draw = BLOCKS[b.type];
        var span = Math.max(1, Math.min(4, Number(b.span) || (b.type === 'stats' || b.type === 'note' ? 4 : 2)));
        el.style.setProperty('--span', span);
        el.classList.toggle('bare', !!BARE[b.type] && !b.title);
        var box = b.type === 'chart' && window.echarts && shown[key].json && el.querySelector('.ech');
        var inst = box && window.echarts.getInstanceByDom(box);
        var same = function (x) { return JSON.stringify([x.type, x.title, x.hint, x.kind, x.height, arr(x.series).length]); };
        if (inst && shown[key].b && same(shown[key].b) === same(b) && arr(b.series).some(function (x) { return nums(x && x.values).length; })) {
          inst.setOption(chartOption(b), { notMerge: true });
          shown[key].json = json; shown[key].b = b;
          el.classList.remove('out');
          var w0 = prev ? prev.nextSibling : grid.firstChild;
          if (el !== w0) grid.insertBefore(el, w0);
          prev = el;
          return;
        }
        dropCharts(el);
        charts = [];
        el.innerHTML = (b.title ? '<h2>' + esc(b.title) + (b.hint ? '<small>' + esc(b.hint) + '</small>' : '') + '</h2>' : '') + (draw ? draw(b) : '<div class="unknown">A block this page can’t draw yet: <code>' + esc(b.type) + '</code></div>') + (b.type === 'actions' ? '' : buttons(b.actions));
        mountCharts(el, charts);
        shown[key].b = b;
        if (shown[key].json) { el.classList.remove('chg'); void el.offsetWidth; el.classList.add('chg'); }
        shown[key].json = json;
      }
      el.classList.remove('out');
      var want = prev ? prev.nextSibling : grid.firstChild;
      if (el !== want) grid.insertBefore(el, want);
      prev = el;
    });
    Object.keys(shown).forEach(function (key) {
      if (seen[key]) return;
      var el = shown[key].el;
      delete shown[key];
      el.classList.add('out');
      setTimeout(function () { dropCharts(el); el.remove(); }, 320);
    });
    tick();
  }
  function tick() { var now = Date.now(); document.querySelectorAll('[data-since]').forEach(function (el) { el.textContent = dur(now - Number(el.getAttribute('data-since'))); }); }
  setInterval(tick, 1000);
  window.coraDashboard = { render: render };
  if (window.cora && window.cora.onData) window.cora.onData(render);
})();
</script>
</body>
</html>

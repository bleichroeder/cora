name: Idea
description: Something Cora could do for you
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to get done?
      description: Where does Cora get in the way, or what do you do by hand today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Any shape you have in mind (optional).

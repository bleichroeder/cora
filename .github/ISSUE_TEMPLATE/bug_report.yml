name: Bug report
description: Something in Cora doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open a session in…
        2. Click…
  - type: input
    id: version
    attributes:
      label: Cora version
      description: Shown in Settings.
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from server.log, desktop.log or ptyhost.log in %USERPROFILE%\.cora. Check them for anything private first.
      render: text

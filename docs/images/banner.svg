<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Cora: a desktop home for your Claude Code sessions">
  <defs>
    <radialGradient id="sky" cx="34%" cy="50%" r="80%">
      <stop offset="0" stop-color="#0f1d2a"/>
      <stop offset="0.55" stop-color="#0a121c"/>
      <stop offset="1" stop-color="#070b12"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#d9fbf5"/>
      <stop offset="0.62" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </radialGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8f7ef"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="1280" height="400" fill="url(#sky)"/>
  <ellipse cx="1040" cy="90" rx="320" ry="190" fill="url(#nebula)"/>
  <ellipse cx="180" cy="360" rx="260" ry="120" fill="url(#nebula)" opacity="0.6"/>

  <!-- stars -->
  <g fill="#cfe9ff">
    <circle cx="62" cy="48" r="1.1" opacity=".7"/><circle cx="148" cy="122" r=".8" opacity=".5"/><circle cx="236" cy="34" r="1.3" opacity=".8"/>
    <circle cx="318" cy="88" r=".7" opacity=".4"/><circle cx="96" cy="300" r="1" opacity=".6"/><circle cx="52" cy="210" r=".7" opacity=".45"/>
    <circle cx="480" cy="28" r=".9" opacity=".6"/><circle cx="560" cy="362" r="1.1" opacity=".55"/><circle cx="640" cy="64" r=".7" opacity=".5"/>
    <circle cx="720" cy="340" r=".8" opacity=".45"/><circle cx="812" cy="40" r="1.2" opacity=".75"/><circle cx="905" cy="318" r=".7" opacity=".5"/>
    <circle cx="980" cy="200" r="1" opacity=".55"/><circle cx="1066" cy="356" r=".8" opacity=".5"/><circle cx="1140" cy="60" r="1.2" opacity=".7"/>
    <circle cx="1212" cy="164" r=".8" opacity=".5"/><circle cx="1240" cy="290" r="1.1" opacity=".6"/><circle cx="1188" cy="372" r=".7" opacity=".45"/>
    <circle cx="410" cy="352" r=".8" opacity=".5"/><circle cx="20" cy="380" r=".9" opacity=".5"/><circle cx="700" cy="180" r=".6" opacity=".35"/>
  </g>

  <!-- the orb (Cora) and its sessions in orbit -->
  <g transform="translate(250 200)">
    <ellipse rx="190" ry="62" fill="none" stroke="#2dd4bf" stroke-opacity=".22" stroke-width="1.2" transform="rotate(-14)"/>
    <ellipse rx="138" ry="44" fill="none" stroke="#8b9cff" stroke-opacity=".22" stroke-width="1.1" transform="rotate(10)"/>
    <circle r="150" fill="url(#halo)"/>
    <circle r="54" fill="url(#core)"/>
    <circle r="54" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"/>
    <!-- sessions: working (green), thinking (violet), needs you (amber), idle (slate) -->
    <g filter="url(#soft)" opacity=".9">
      <circle cx="-184" cy="46" r="10" fill="#34d399" opacity=".45"/>
      <circle cx="152" cy="-70" r="9" fill="#a78bfa" opacity=".45"/>
      <circle cx="61" cy="50" r="11" fill="#fbbf24" opacity=".45"/>
    </g>
    <circle cx="-184" cy="46" r="6.5" fill="#34d399"/>
    <circle cx="152" cy="-70" r="5.5" fill="#a78bfa"/>
    <circle cx="61" cy="50" r="7" fill="#fbbf24"/>
    <circle cx="-125" cy="-37" r="4.5" fill="#94a3b8"/>
    <circle cx="178" cy="-23" r="3.5" fill="#5eead4"/>
  </g>

  <!-- wordmark and line -->
  <g font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="520" y="196" font-size="104" font-weight="700" letter-spacing="-3" fill="url(#word)">Cora</text>
    <text x="524" y="246" font-size="27" font-weight="400" fill="#b6c4d6">A desktop home for your Claude Code sessions</text>
    <text xml:space="preserve" x="525" y="300" font-size="15.5" font-weight="600" letter-spacing="1.6" fill="#5eead4">SEE THE WORK<tspan fill="#4a5a6e">   ·   </tspan>ANSWER FROM ONE PLACE<tspan fill="#4a5a6e">   ·   </tspan>AN ASSISTANT OF ITS OWN</text>
  </g>
</svg>
